    <style>
        /* CSS KHUSUS LAYAR PEMBUKA */

        /* Layar Gelap Utama */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 1s ease, visibility 1s ease;
            font-family: 'Poppins', sans-serif;
        }

        /* Kartu Ucapan */
        .welcome-card {
            text-align: center;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            max-width: 400px;
            width: 85%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .welcome-card h1 {
            color: #ff8da1;
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .welcome-card p {
            color: #d1d5db;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 300;
        }

        /* Wadah Pemutar Spotify */
        .spotify-container {
            width: 100%;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        /* Tombol Buka */
        #open-btn {
            background: linear-gradient(135deg, #ee5286, #f672b0);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(238, 82, 134, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #open-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(238, 82, 134, 0.6);
        }

        #open-btn:active {
            transform: scale(0.98);
        }

        /* Efek Menghilang */
        .fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>

    <script>
      window.onload = null;

      function startFlowerApp() {
        // 1. Ambil elemen pemutar Spotify
        const spotifyWidget = document.getElementById('spotify-widget');
        
        // 2. Memicu autoplay dengan menambahkan parameter play otomatis ke src Spotify
        if (spotifyWidget) {
          const currentSrc = spotifyWidget.src;
          // Tambahkan flag autoplay agar lagu langsung berputar setelah tombol diklik
          spotifyWidget.src = currentSrc + "&autoplay=1";
        }

        // 3. Memudarkan layar pembuka
        const welcomeScreen = document.getElementById('welcome-screen');
        welcomeScreen.classList.add('fade-out');

        // 4. Memulai seluruh animasi bunga secara sinkron
        setTimeout(() => {
          document.body.classList.remove('container');
        }, 1000); 
      }
