<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>im sorry my loveee....</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ANIMASI HATI -->
  <div class="hearts"></div>


  <!-- =========================
       HALAMAN AWAL
  ========================== -->

  <section id="opening" class="screen">

    <div class="card">

      <div class="emoji">
        💌
      </div>

      <h1>
        sayanggg
      </h1>

      <p>
        akuu mauu bilangg sesuatuu
      </p>

      <button id="openBtn">
        tekenn ini sayangg 
      </button>

    </div>

  </section>


  <!-- =========================
       HALAMAN SURAT
  ========================== -->

  <section id="letter" class="screen hidden">

    <div class="letter">

      <div class="letter-top">
        <span>💌</span>
      </div>


      <h2>
        maafinn tamaa yaa
      </h2>


      <div class="message">

        <p id="text"></p>

      </div>


      <button id="nextBtn">
        Lanjut →
      </button>

    </div>

  </section>


  <!-- =========================
       HALAMAN PENUTUP
  ========================== -->

  <section id="ending" class="screen hidden">

    <div class="ending-card">

      <div class="big-heart">
        ❤️
      </div>


      <h1>
        maafin tama...
      </h1>


      <p>
        aku mungkin ngga selalu bisa melakukan
        semuanya dengan baik.
      </p>


      <p>
        tapi aku benar-benar menghargai kamu.
      </p>


      <button id="restartBtn">
        Baca lagi 💌
      </button>

    </div>

  </section>


  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>

</html>
